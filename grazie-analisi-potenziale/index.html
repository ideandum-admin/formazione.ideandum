<title>Contatto ricevuto – Ideandum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Nimbus Sans Ext";src:url(/_assets/fonts/NimbusSanExt-Reg.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Nimbus Sans Ext";src:url(/_assets/fonts/NimbusSanExt-Bol.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --page:#F5F5F5; --veil:rgba(255,255,255,.72);
  --surface:rgba(255,255,255,.78); --surface-solid:#FFFFFF; --line:#D6D6D6; --line-strong:#373737;
  --ink:#000000; --text:#302F2F; --muted:#6B6B6B;
  --pink:#E42980; --pink-hover:#C91F6F; --on-pink:#FFFFFF;
  --dark-line:var(--line);
  --dark-ink:var(--ink); --dark-muted:var(--muted); --track:#E4E7EC; --cyan:#2BB3D6; --violet:#5260D8; --err:#C4183C; --logo-filter:none;
  --field-bg:#FFFFFF; --field-ink:#000000;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#000000; --veil:rgba(0,0,0,.25);
    --surface:rgba(16,17,20,.74); --surface-solid:#121316; --line:rgba(255,255,255,.14); --line-strong:rgba(255,255,255,.4);
    --ink:#FFFFFF; --text:#E8E9EC; --muted:#A3A8B1;
    --pink:#FF3D97; --pink-hover:#FF5AA8; --on-pink:#1A0010;
    --dark-line:rgba(255,255,255,.14); --track:rgba(255,255,255,.12);
    --err:#FF7A90; --logo-filter:invert(1);
    --field-bg:#1B1C20; --field-ink:#FFFFFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#000000; --veil:rgba(0,0,0,.25);
  --surface:rgba(16,17,20,.74); --surface-solid:#121316; --line:rgba(255,255,255,.14); --line-strong:rgba(255,255,255,.4);
  --ink:#FFFFFF; --text:#E8E9EC; --muted:#A3A8B1;
  --pink:#FF3D97; --pink-hover:#FF5AA8; --on-pink:#1A0010;
  --dark-line:rgba(255,255,255,.14); --track:rgba(255,255,255,.12);
  --err:#FF7A90; --logo-filter:invert(1);
  --field-bg:#1B1C20; --field-ink:#FFFFFF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--text);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;position:relative;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--page) url(/_assets/img/bg-aura.webp) no-repeat right -8vw top -6vh / min(1100px,95vw) auto}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--veil);pointer-events:none}
h1,h2,h3,.big{font-family:"Nimbus Sans Ext","Inter",Arial,sans-serif;font-weight:700;letter-spacing:-0.01em;margin:0;color:var(--ink)}
p{margin:0 0 12px}
[hidden]{display:none !important}
.page{max-width:1040px;margin:0 auto;padding:28px 20px 40px}
.brand{display:block;height:26px;width:auto;filter:var(--logo-filter);margin-bottom:26px}
header{max-width:700px;margin-bottom:20px}
.beta{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);border:1.5px solid var(--line);border-radius:60px;padding:4px 14px;margin-bottom:14px;background:var(--surface)}
.beta::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pink)}
h1{font-size:clamp(24px,3.6vw,36px);line-height:1.12;margin-bottom:10px}
header p{color:var(--text);font-size:17px;max-width:60ch}

.steps{display:flex;gap:8px;margin:0 0 18px;padding:0;list-style:none;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted);padding:5px 12px 5px 5px;border-radius:60px;border:1px solid var(--line);background:var(--surface)}
.steps li span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.steps li[aria-current="step"]{color:var(--ink);border-color:var(--line-strong)}
.steps li[aria-current="step"] span,.steps li.done span{background:var(--pink);border-color:var(--pink);color:var(--on-pink)}

/* superfici */

/* cornice unica */
.frame{background:var(--surface);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);overflow:hidden}
.frame .steps{margin:0;padding:16px 24px;border-bottom:1px solid var(--line)}
.layout{gap:0 !important}
.panel{border-left:1px solid var(--line)}
@media (max-width:860px){.panel{border-left:0;border-top:1px solid var(--line)}}
.method + .req{border-top:1px solid var(--line)}
/* passo 1 */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:stretch}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.card{padding:6px 24px}
.row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row label,.row .lab{font-weight:600;font-size:16px;display:block;color:var(--ink)}
.row small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.stepper{display:flex;align-items:center;flex:none;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;background:var(--field-bg)}
.stepper button{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:20px;font-weight:500;width:42px;height:44px;cursor:pointer}
.stepper button:hover{background:var(--line)}
.stepper output{min-width:44px;text-align:center;font-family:"Nimbus Sans Ext",Arial,sans-serif;font-weight:700;font-size:19px;color:var(--ink)}
.days{display:flex;gap:5px;flex-wrap:nowrap;justify-content:flex-end;flex:none}
.row > div:first-child{flex:1 1 auto;min-width:0}
.day{appearance:none;font:inherit;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);background:var(--field-bg);border:1px solid var(--line-strong);border-radius:4px;padding:9px 0;min-width:40px}
.day.wide{padding:9px 10px}
.day:hover{border-color:var(--pink)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--page)}
.money{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:4px;padding:0 12px;background:var(--field-bg);width:210px}
.money:focus-within{border-color:var(--pink);box-shadow:0 0 0 3px color-mix(in srgb,var(--pink) 18%,transparent)}
.money input{border:0;outline:0;background:transparent;color:var(--field-ink);font-family:"Nimbus Sans Ext",Arial,sans-serif;font-weight:700;font-size:19px;width:100%;padding:10px 0;text-align:right}
.money input::placeholder{color:var(--muted);font-weight:400}
.money span{font-weight:700;font-size:18px;color:var(--muted);margin-left:6px}
.money.bad{border-color:var(--err)}
.ferr{color:var(--err);font-size:13px;margin-top:6px;text-align:right;max-width:210px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;margin-top:10px}
.seg button{appearance:none;border:0;background:var(--field-bg);color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.money input:focus-visible{outline:0}
@media (max-width:560px){
  .card{padding:2px 16px}
  .row{flex-direction:column;align-items:flex-start}
  .days{justify-content:flex-start;flex-wrap:wrap}
  .money{width:100%}
  .ferr{text-align:left;max-width:none}
}

.panel{padding:24px;display:flex;flex-direction:column}
.panel h2{font-family:"Inter",Arial,sans-serif;font-size:14px;font-weight:500;letter-spacing:0;color:var(--dark-muted);margin-bottom:6px}
.pm{color:var(--dark-muted);font-size:14px}
.sat-num{font-size:56px;line-height:1}
.sat-bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin:16px 0 10px}
.sat-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:99px;transition:width .3s ease}
.p-div{border-top:1px solid var(--dark-line);margin:18px 0 16px}
.l-gain{font-size:32px;line-height:1.1;color:var(--pink) !important;margin:2px 0 4px}
.spacer{flex:1;min-height:20px}

.btn{appearance:none;border:1px solid var(--pink);cursor:pointer;font:inherit;font-weight:700;font-size:15px;background:var(--pink);color:var(--on-pink);
  padding:14px 22px;border-radius:3px;text-align:center;text-decoration:none;display:inline-block;transition:background .15s,border-color .15s}
.btn:hover{background:var(--pink-hover);border-color:var(--pink-hover)}
.panel .btn,.pot .btn.amber{background:#E42980;border-color:#E42980;color:#fff}
.panel .btn:hover,.pot .btn.amber:hover{background:#C91F6F;border-color:#C91F6F}
.panel .btn{width:100%}
.btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost-l{background:transparent;color:var(--ink);border-color:var(--line-strong);font-weight:500}
.btn.ghost-l:hover{border-color:var(--pink);background:transparent}

/* passo 2 */
.pot{padding:26px 28px}
.pot-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--dark-line)}
.pot .pm{margin:0}
.pot-num{font-size:clamp(38px,6.4vw,58px);line-height:1;color:var(--pink) !important;margin:8px 0 8px}
.pot-sat{text-align:right}
.pot-sat .big{font-size:30px;line-height:1}
.areas-t{font-size:16px;margin:20px 0 0}
.areas{display:grid;gap:12px;margin:14px 0 4px}
.area{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) 7.5rem;gap:14px;align-items:center}
.area .n{font-weight:600;font-size:15px;line-height:1.25}
.area .n small{display:block;font-weight:400;color:var(--dark-muted);font-size:13px}
.area .tr{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.area .tr i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.area .v{text-align:right;font-family:"Nimbus Sans Ext",Arial,sans-serif;font-weight:700;font-size:17px;white-space:nowrap}
@media (max-width:600px){
  .area{grid-template-columns:1fr auto;row-gap:6px}
  .area .tr{grid-column:1 / -1;grid-row:2}
  .pot-sat{text-align:left}
}
.hook{font-size:17px;line-height:1.45;margin:20px 0 18px;max-width:60ch;color:var(--dark-ink)}
.pot-acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* passo 3 */
.two{display:grid;grid-template-columns:1fr;gap:0}
.method,.req{padding:26px}
.method h2,.req h2{font-size:20px;line-height:1.2;margin-bottom:10px}
.method > p,.req p{color:var(--text);max-width:68ch}
.el{list-style:none;padding:0;margin:4px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;counter-reset:el}
.el li{counter-increment:el;display:flex;gap:12px;align-items:center;font-weight:600;font-size:15px;color:var(--ink);padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface-solid)}
.el li::before{content:counter(el);flex:none;font-family:"Nimbus Sans Ext",Arial,sans-serif;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--cyan),var(--violet));width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.field{margin-bottom:11px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:4px;color:var(--ink)}
.field input{width:100%;font:inherit;font-size:15px;color:var(--field-ink);background:var(--field-bg);border:1px solid var(--line-strong);border-radius:3px;padding:11px 12px}
.field input:focus{outline:0;border-color:var(--pink);box-shadow:0 0 0 3px color-mix(in srgb,var(--pink) 18%,transparent)}
.field input.bad{border-color:var(--err)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text);margin:4px 0 14px}
.check input{margin-top:2px;width:15px;height:15px;flex:none;accent-color:var(--pink)}
.check a{color:var(--text)}
.formerr{color:var(--err);font-size:14px;margin:0 0 10px}
.req .btn{width:100%}
.back3{margin-top:14px;background:none;border:0;padding:0;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ok{width:40px;height:40px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;margin-bottom:12px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}
.thanks{background:var(--surface);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:64px 32px;text-align:center;max-width:720px;margin:48px auto 0}
.thanks .ok{margin:0 auto 20px;width:54px;height:54px;font-size:26px}
.thanks h1{margin-bottom:10px}
.thanks p{font-size:18px;margin:0;color:var(--text)}
@media (prefers-reduced-motion:reduce){.sat-bar span,.btn{transition:none}}
</style>
</head>
