<!-- Carosello "Eventi Passati" – da incollare UNA VOLTA in un widget HTML di Elementor
     (ideandum.com/marketing-odontoiatria/#eventi). I webinar arrivano da
     https://formazione.ideandum.com/eventi-sito/prossimi-webinar.js ; qui compaiono da soli dal giorno dopo la data, dal più recente. Il click porta alla piattaforma. -->
<div class="idm-evp" id="idm-evp">
  <button class="idm-evp-nav idm-evp-prev" type="button" aria-label="Precedente">&#8249;</button>
  <div class="idm-evp-track" id="idm-evp-track"></div>
  <button class="idm-evp-nav idm-evp-next" type="button" aria-label="Successivo">&#8250;</button>
  <div class="idm-evp-dots" id="idm-evp-dots"></div>
</div>
<style>
.idm-evp{position:relative;max-width:760px;margin:0 auto;padding:0 34px}
.idm-evp-track{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;-ms-overflow-style:none}
.idm-evp-track::-webkit-scrollbar{display:none}
.idm-evp-item{flex:0 0 calc((100% - 60px)/4);scroll-snap-align:start;display:block;line-height:0}
.idm-evp-item img{width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;display:block;transition:transform .2s ease}
.idm-evp-item:hover img{transform:scale(1.02)}
.idm-evp-nav{position:absolute;top:50%;transform:translateY(-50%);margin-top:-14px;background:none;border:0;font-size:46px;line-height:1;color:#000;cursor:pointer;padding:0 6px}
.idm-evp-prev{left:0}.idm-evp-next{right:0}
.idm-evp-nav[disabled]{opacity:.2;cursor:default}
.idm-evp-dots{display:flex;justify-content:center;gap:10px;margin-top:20px;min-height:8px}
.idm-evp-dots button{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:#c4c4c4;cursor:pointer}
.idm-evp-dots button.on{background:#000}
.idm-evp-vuoto{width:100%;text-align:center;font-size:16px;line-height:1.5;padding:30px 0}
@media (max-width:1024px){.idm-evp-item{flex-basis:calc((100% - 40px)/3)}}
@media (max-width:640px){.idm-evp{padding:0 26px}.idm-evp-item{flex-basis:calc((100% - 20px)/2)}.idm-evp-nav{font-size:38px}}
</style>
<script>
(function(){
  var track=document.getElementById('idm-evp-track'),dots=document.getElementById('idm-evp-dots'),box=document.getElementById('idm-evp');
  var prev=box.querySelector('.idm-evp-prev'),next=box.querySelector('.idm-evp-next');
  function oggiRoma(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
  function perVista(){var w=window.innerWidth;return w<=640?2:(w<=1024?3:4);}
  function pagine(){return Math.max(1,track.children.length-perVista()+1);}
  function aggiorna(){
    var step=track.children[0]?track.children[0].getBoundingClientRect().width+20:1;
    var i=Math.round(track.scrollLeft/step),n=pagine();
    prev.disabled=i<=0;next.disabled=i>=n-1;
    for(var k=0;k<dots.children.length;k++)dots.children[k].className=k===i?'on':'';
  }
  function vai(i){var el=track.children[i];if(el)track.scrollTo({left:el.offsetLeft-track.offsetLeft,behavior:'smooth'});}
  function costruisci(){
    var oggi=oggiRoma(),lista=(window.IDEANDUM_PROSSIMI_WEBINAR||[]).filter(function(e){return e.data<oggi;}).sort(function(a,b){return a.data<b.data?1:-1;});
    track.innerHTML='';dots.innerHTML='';
    if(!lista.length){track.innerHTML='<div class="idm-evp-vuoto">Le registrazioni dei webinar sono nella piattaforma.</div>';prev.style.display=next.style.display='none';return;}
    lista.forEach(function(e){
      var a=document.createElement('a');a.className='idm-evp-item';a.href=e.link_passato;a.target='_blank';a.rel='noopener';
      var img=document.createElement('img');img.src=e.immagine;img.alt=e.titolo;img.loading='lazy';img.width=800;img.height=800;
      a.appendChild(img);track.appendChild(a);
    });
    var n=pagine();
    for(var k=0;k<n;k++){(function(k){var b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Vai al gruppo '+(k+1));b.onclick=function(){vai(k);};dots.appendChild(b);})(k);}
    var mostra=lista.length>perVista();prev.style.display=next.style.display=mostra?'':'none';dots.style.visibility=mostra?'':'hidden';track.style.justifyContent=mostra?'flex-start':'center';
    aggiorna();
  }
  prev.onclick=function(){var s=track.children[0].getBoundingClientRect().width+20;track.scrollBy({left:-s,behavior:'smooth'});};
  next.onclick=function(){var s=track.children[0].getBoundingClientRect().width+20;track.scrollBy({left:s,behavior:'smooth'});};
  track.addEventListener('scroll',function(){window.requestAnimationFrame(aggiorna);});
  window.addEventListener('resize',costruisci);
  document.addEventListener('idm-eventi-pronti',costruisci);
  if(window.IDEANDUM_PROSSIMI_WEBINAR){costruisci();}
  else if(!window.IDEANDUM_EVENTI_IN_CARICAMENTO){
    window.IDEANDUM_EVENTI_IN_CARICAMENTO=true;
    var s=document.createElement('script');
    s.src='https://formazione.ideandum.com/eventi-sito/prossimi-webinar.js?v='+Math.floor(Date.now()/3600000);
    document.head.appendChild(s);
  }
})();
</script>
