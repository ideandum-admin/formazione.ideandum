<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventi Passati | Ideandum</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  /* =========================================================
     PAGINA GENERATA: non modificare eventi-passati/index.html a mano.
     Gli eventi sono in data/eventi-passati.json (repository
     ideandum-hub/formazione.ideandum); dopo una modifica lanciare
     python3 scripts/genera_eventi_passati.py, poi commit e push.
     ========================================================= */

  @font-face{
    font-family: 'Nimbus Sans Ext';
    src: url('/_assets/fonts/NimbusSanExt-Reg.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face{
    font-family: 'Nimbus Sans Ext';
    src: url('/_assets/fonts/NimbusSanExt-Bol.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --ink: #16241F;
    --teal: #2F5D56;
    --accent: #C88B3A;
    --line: #E3DFD6;
    --muted: #6B7268;
    --card: #FFFFFF;
    --font-display: 'Nimbus Sans Ext', 'Inter', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background-color: #FFFFFF;
    background-image: url('/_assets/img/bg-aura.webp');
    background-repeat: no-repeat;
    background-position: top center;
    background-size: 1600px auto;
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; }

  .wrap{
    max-width: 780px;
    margin: 0 auto;
    padding: 0 24px;
  }

  header.page{
    padding: 96px 0 48px;
  }

  .eyebrow{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--teal);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }

  .eyebrow::before{
    content: "";
    width: 22px;
    height: 1px;
    background: var(--teal);
    display: inline-block;
  }

  h1{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(36px, 6vw, 52px);
    line-height: 1.05;
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }

  header.page p{
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 46ch;
    margin: 0;
  }

  main{
    padding: 40px 0 100px;
    position: relative;
  }

  .timeline{
    position: relative;
  }

  .timeline::before{
    content: "";
    position: absolute;
    left: 5px;
    top: 8px;
    bottom: 8px;
    width: 1px;
    background: var(--line);
  }

  .entry{
    position: relative;
    padding-left: 40px;
    margin-bottom: 40px;
  }

  .entry:last-child{ margin-bottom: 0; }

  .entry::before{
    content: "";
    position: absolute;
    left: 0px;
    top: 10px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #FFFFFF;
    border: 2px solid var(--teal);
  }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 28px 28px 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(22, 36, 31, 0.04);
  }

  .stamp{
    position: absolute;
    top: 18px;
    right: -6px;
    width: 96px;
    height: 96px;
    border: 1.5px dashed var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(-10deg);
    opacity: 0.55;
    pointer-events: none;
  }

  .stamp span{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
    line-height: 1.4;
  }

  .date{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 10px;
    display: inline-block;
  }

  .card h2{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 23px;
    line-height: 1.25;
    margin: 0 0 8px;
    max-width: 80%;
  }

  .card .sottotitolo{
    font-family: var(--font-body);
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--muted);
    margin: 0 0 22px;
    max-width: 85%;
  }

  .cta{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--ink);
    color: #fff;
    text-decoration: none;
    font-family: var(--font-body);
    font-size: 13.5px;
    line-height: 1.5;
    font-weight: 500;
    padding: 12px 18px;
    border-radius: 3px;
    max-width: 100%;
    transition: background 0.15s ease;
  }

  .cta:hover{ background: var(--teal); }

  .cta svg{ flex: none; width: 16px; height: 16px; }

  .cta-text{ max-width: 46ch; }

  .empty{
    padding: 40px 0;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 14px;
    font-style: italic;
  }

  footer{
    border-top: 1px solid var(--line);
    padding: 28px 0 60px;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 12.5px;
    color: var(--muted);
  }

  @media (max-width: 600px){
    body{ background-size: 900px auto; }
    header.page{ padding: 64px 0 36px; }
    main{ padding: 32px 0 72px; }
    .card{ padding: 22px 18px 20px; }
    .card h2, .card .sottotitolo{ max-width: 100%; }
    .stamp{ width: 76px; height: 76px; top: 14px; right: -10px; }
    .stamp span{ font-size: 9px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="page">
    <div class="eyebrow">Archivio webinar</div>
    <h1>Eventi passati</h1>
    <p>I webinar gratuiti che abbiamo già trasmesso. Se un argomento ti interessa ma non hai fatto in tempo a seguirlo dal vivo, scrivici: ti aggiorniamo noi.</p>
  </header>

  <main>
    <div class="timeline" id="timeline"></div>
    <div class="empty" id="empty" style="display:none;">Non ci sono ancora eventi archiviati.</div>
  </main>

  <footer>Ideandum — marketing per studi dentistici</footer>
</div>

<script>
  /* Elenco generato da scripts/genera_eventi_passati.py (dal più recente) */

  const EVENTI = {{EVENTI}};

  const WHATSAPP_NUMERO = "393925457622"; // Armida
  const CTA_TESTO = "Ti interessa l'argomento ma non hai seguito il webinar? Scrivi ad Armida 3925457622.";

  function waLink(){
    return "https://wa.me/" + WHATSAPP_NUMERO + "?text=" + encodeURIComponent(CTA_TESTO);
  }

  const timeline = document.getElementById("timeline");
  const empty = document.getElementById("empty");

  if(EVENTI.length === 0){
    empty.style.display = "block";
  } else {
    EVENTI.forEach(function(ev){
      const entry = document.createElement("div");
      entry.className = "entry";
      entry.innerHTML =
        '<div class="card">' +
          '<div class="stamp"><span>Archiviato</span></div>' +
          '<span class="date">' + ev.data + '</span>' +
          '<h2>' + ev.titolo + '</h2>' +
          '<p class="sottotitolo">' + ev.sottotitolo + '</p>' +
          '<a class="cta" href="' + waLink() + '" target="_blank" rel="noopener">' +
            '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.29-1.39a9.9 9.9 0 0 0 4.7 1.2h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m0 1.67c2.24 0 4.34.87 5.92 2.45a8.23 8.23 0 0 1 2.43 5.87c0 4.58-3.73 8.31-8.32 8.31a8.3 8.3 0 0 1-4.22-1.15l-.3-.18-3.14.82.84-3.06-.2-.32a8.26 8.26 0 0 1-1.27-4.4c0-4.59 3.73-8.34 8.32-8.34m-4.6 4.8c-.16 0-.42.06-.64.3-.22.25-.85.83-.85 2.02 0 1.2.87 2.35.99 2.51.12.17 1.71 2.6 4.14 3.65.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.43-.58 1.63-1.15.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28-.24-.12-1.43-.7-1.65-.78-.22-.08-.38-.12-.55.12-.16.24-.63.78-.77.94-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.93-1.19-.71-.63-1.2-1.42-1.34-1.66-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.36-.76-1.86-.2-.48-.4-.42-.55-.42h-.47" /></svg>' +
            '<span class="cta-text">' + CTA_TESTO + '</span>' +
          '</a>' +
        '</div>';
      timeline.appendChild(entry);
    });
  }
</script>

</body>
</html>
